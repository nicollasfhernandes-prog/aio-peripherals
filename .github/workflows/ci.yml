# Type-checks the frontend and runs the protocol unit tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Protocol tests
        working-directory: src-tauri
        run: cargo test --lib
